services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: depi-rag-api
    env_file:
      - ../.env
    environment:
      QDRANT_REMOTE: "true"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_HTTPS: "false"
      METADATA_BACKEND: sqlite
      METADATA_DB_PATH: /app/uploads/app_metadata.sqlite3
      ARTIFACT_STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: rag-artifacts
      MINIO_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - minio
    volumes:
      - ../uploads:/app/uploads
      - ../reports:/app/reports
      - ../mlruns:/app/mlruns
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: depi-rag-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: depi-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: depi-rag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: depi-rag-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped


volumes:
  qdrant_data:
  minio_data:
  grafana_data:
