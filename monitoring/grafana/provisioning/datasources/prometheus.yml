# Run Grafana in deferent terminal with the following command:
# grafana-server \
#  --homepath /usr/share/grafana \
#  --config /etc/grafana/grafana.ini \
#  cfg:default.paths.provisioning=./monitoring/grafana/provisioning

# URL: http://localhost:3000
# Username: admin
# Password: admin

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: false