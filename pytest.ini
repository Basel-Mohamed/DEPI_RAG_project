[pytest]
addopts = -p no:cacheprovider
markers =
    integration: tests that call external services such as hosted LLM APIs
filterwarnings =
    ignore:Module already imported so cannot be rewritten; anyio:pytest.PytestAssertRewriteWarning
    ignore:deprecated:DeprecationWarning:docling\.models\.stages\.ocr\.rapid_ocr_model
    ignore:Use document instead\.:DeprecationWarning:docling\.utils\.export
